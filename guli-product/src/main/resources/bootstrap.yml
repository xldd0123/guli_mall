server:
  port: 7001
spring:
  cache:
    type: redis
    redis:
      time-to-live: 120000
      cache-null-values: true
#      key-prefix: redis_key_  不指定 key-prefix，则默认就是 cache 的 value 作为前缀
      use-key-prefix: true
  application:
    name: guli-product
  cloud:
    nacos:
      discovery:
        namespace: 9a9e0fdc-ce37-451b-b2e3-f478eb6bfb36
        group: dev
        server-addr: 192.168.174.183:8848
      config:
        server-addr: 192.168.174.183:8848
        file-extension: yml
        namespace: 9a9e0fdc-ce37-451b-b2e3-f478eb6bfb36
        group: dev
        extension-configs:
          - data-id: product-datasource.yml
            group: dev
            refresh: true
          - data-id: product-mybatis.yml
            group: dev
            refresh: true
          - data-id: product-port.yml
            group: dev
            refresh: true
  jackson:
    # 指定日期格式化时间
    date-format: yyyy-MM-dd HH:mm:ss
  thymeleaf:
    cache: false
  redis:
    host: 192.168.174.183
    port: 6379
logging:
  level:
    com.xueliandan.gulimall.product.dao.PmsAttrGroupDao: error
    com.xueliandan.gulimall.product.dao.PmsSpuInfoDao: error